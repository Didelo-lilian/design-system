name: Publish

# The GitHub release is created by release-please with a GitHub App token, so this event does start the workflow.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the provenance statement is signed with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      # No token: npm trusts this workflow (a trusted publisher set on the package) and signs the provenance.
      - run: npm publish
